<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Apenas QR Codes - Hanguk House</title>
  <style>
    @page {
      size: A4;
      margin: 10mm;
    }
    body {
      font-family: sans-serif;
      background: #f0f2f5;
      margin: 0;
      padding: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 15px;
      max-width: 800px;
      width: 100%;
    }
    .qr-item {
      background: white;
      border: 1px dashed #bbb;
      border-radius: 8px;
      padding: 12px;
      display: flex;
      justify-content: center;
      align-items: center;
      aspect-ratio: 1 / 1;
      page-break-inside: avoid;
      box-sizing: border-box;
    }
    .qr-item img {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }
    .no-print {
      margin-bottom: 20px;
    }
    @media print {
      body { background: white; padding: 0; }
      .grid { gap: 10px; }
      .qr-item { border: 1px dashed #ccc; padding: 8px; }
      .no-print { display: none; }
    }
  </style>
</head>
<body>
  <div class="no-print">
    <button onclick="window.print()" style="padding: 12px 24px; background: #1a1a1a; color: white; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; font-size: 14px;">🖨️ Imprimir Folha com QR Codes (A4)</button>
  </div>

  <div class="grid">
    <!-- 9 QR Codes limpos na grade A4 (3x3) para corte em adesivos/placas -->
    <div class="qr-item"><img src="qrcode_hanguk.png" alt="QR Code"></div>
    <div class="qr-item"><img src="qrcode_hanguk.png" alt="QR Code"></div>
    <div class="qr-item"><img src="qrcode_hanguk.png" alt="QR Code"></div>
    <div class="qr-item"><img src="qrcode_hanguk.png" alt="QR Code"></div>
    <div class="qr-item"><img src="qrcode_hanguk.png" alt="QR Code"></div>
    <div class="qr-item"><img src="qrcode_hanguk.png" alt="QR Code"></div>
    <div class="qr-item"><img src="qrcode_hanguk.png" alt="QR Code"></div>
    <div class="qr-item"><img src="qrcode_hanguk.png" alt="QR Code"></div>
    <div class="qr-item"><img src="qrcode_hanguk.png" alt="QR Code"></div>
  </div>
</body>
</html>
